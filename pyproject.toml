[project]
name = "pogo-scout"
version = "0.1.0"
description = "Personal Pokemon Go scout bot for Singapore"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-telegram-bot>=21.0",
  "pyyaml>=6.0",
  "staticmap>=0.5.7",
  "Pillow>=10.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "freezegun>=1.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
