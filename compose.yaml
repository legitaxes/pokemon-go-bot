# Dockge stack for pogo-scout.
#
# Paste this file into the Dockge UI ("Create Stack" → name "pogo-scout" →
# paste below). Dockge writes it to /opt/stacks/pogo-scout/compose.yaml.
#
# Before deploying, on the Dockge host:
#   /opt/stacks/pogo-scout/.env                — fill via Dockge's env editor
#   /opt/stacks/pogo-scout/data/config.yaml    — create once, see deploy/dockge.md
#
# After the first start, run once on the host (see §5 of deploy/dockge.md):
#   docker exec pogo-scout-tailscale tailscale funnel --bg --set-path=/webhook http://localhost:8000/webhook
#
# The data/ directory persists the SQLite DB and Tailscale node state across redeploys.

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: pogo-scout-tailscale
    hostname: pogo-scout   # → pogo-scout.<your-tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./data/ts-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw

  pogo-scout:
    image: ghcr.io/legitaxes/pokemon-go-bot:latest
    pull_policy: always
    container_name: pogo-scout
    restart: unless-stopped
    # Share Tailscale's network namespace so Funnel can proxy localhost:8000
    # to the bot. No 'ports:' needed — Funnel is the only public path in.
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./data:/data
