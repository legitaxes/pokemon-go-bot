# Dockge stack for pogo-scout.
#
# Paste this file into the Dockge UI ("Create Stack" → name "pogo-scout" →
# paste below). Dockge writes it to /opt/stacks/pogo-scout/compose.yaml.
#
# Before deploying, on the Dockge host:
#   /opt/stacks/pogo-scout/.env                — fill via Dockge's env editor
#   /opt/stacks/pogo-scout/data/config.yaml    — create once, see deploy/dockge.md
#
# The data/ directory persists the SQLite DB across redeploys.

services:
  pogo-scout:
    image: ghcr.io/legitaxes/pokemon-go-bot:latest
    pull_policy: always   # so redeploys from Dockge pick up new :latest images
    container_name: pogo-scout
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    # No 'ports:' on purpose — the bot is only reachable from the cloudflared
    # sidecar on the internal stack network. /healthz stays internal.
    networks:
      - pogo-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pogo-scout-tunnel
    restart: unless-stopped
    # TUNNEL_TOKEN comes from .env. Create the tunnel in the Cloudflare dashboard
    # (Zero Trust → Networks → Tunnels), copy the token, paste it into .env.
    # Configure the public hostname + path /webhook → http://pogo-scout:8000
    # from the same dashboard page.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      pogo-scout:
        condition: service_started
    networks:
      - pogo-net

networks:
  pogo-net:
    driver: bridge
